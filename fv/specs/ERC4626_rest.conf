{
    "build_cache": true,
    "exclude_rule": [
        "setupIsSatisfiable",
        "totalSupplyIsSumOfBalances",
        "vaultNeverOvercommitted",
        "roundTripNeverCreatesValue",
        "roundingGapIsAtMostOne",
        "depositGapCanBeOne",
        "mintGapCanBeOne",
        "maxBoundaryIsConsistent",
        "redeemMaxNeverReverts",
        "withdrawMaxNeverReverts",
        "depositConserves",
        "mintConserves",
        "withdrawConserves",
        "redeemConserves",
        "depositIsNotSplittable",
        "withdrawIsNotSplittable",
        "holdingBackAcrossDonationDoesNotPay"
    ],
    "files": [
        "fv/harnesses/ERC4626Harness.sol"
    ],
    "global_timeout": 600,
    "msg": "ERC4626 complement shard: the builtin sanity rule, plus anything not named in ERC4626.conf",
    "optimistic_loop": true,
    "parametric_contracts": [
        "ERC4626Harness"
    ],
    "process": "emv",
    "rule_sanity": "basic",
    "url_visibility": "public",
    "verify": "ERC4626Harness:fv/specs/ERC4626.spec"
}
