name: Compare gas costs
description: Compare gas costs between branches
inputs:
  token:
    description: GitHub token, required to access GitHub API
    required: true
  report:
    description: Path to the report to compare
    required: false
    default: gasReporterOutput.json
  out_report:
    description: Path to save the output report
    required: false
    default: ${{ github.ref_name }}.gasreport.json
  ref_report:
    description: Path to the reference report for comparison
    required: false
    default: ${{ github.base_ref }}.gasreport.json
  src:
    description: Directory holding the sources the report measures, walked to resolve what a diff reaches
    required: false
    default: contracts-exposed

runs:
  using: composite
  steps:
    - name: Download reference report
      if: github.event_name == 'pull_request'
      run: |
        RUN_ID=`gh run list --repo ${{ github.repository }} --branch ${{ github.base_ref }} --workflow ${{ github.workflow }} --limit 100 --json 'conclusion,databaseId,event' --jq 'map(select(.conclusion=="success" and .event!="pull_request"))[0].databaseId'`
        gh run download ${RUN_ID} --repo ${{ github.repository }} -n gasreport
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      shell: bash
      continue-on-error: true
    # Which contracts the diff can actually reach. Everything else in the report is only ever
    # measuring test-suite churn: min/max/avg/median are taken over whatever calls the run happened
    # to make, so moving a single test case shifts them with no contract change behind it.
    # `contracts-exposed` is what the suite deploys, and it is generated by the build that has
    # already run in this job, so the walk starts there and follows the imports back into
    # `contracts`. `--allow-removed` because those wrappers are generated and gitignored: they never
    # appear in a diff, so the guard against dropping an entry point has nothing to protect here.
    # The two commands are deliberately not a pipeline: a pipeline hands the walk an empty stdin
    # when gh fails, and an empty change list is not an error to the walk -- it resolves to no
    # affected contract and writes a perfectly valid `[]`, which filters every row away. Failing
    # open means writing no diff.json at all, so gh has to be allowed to fail before the walk runs.
    - name: Resolve the contracts reached by this pull request
      if: github.event_name == 'pull_request' && hashFiles(inputs.ref_report) != ''
      run: |
        gh pr diff '${{ github.event.number }}' --repo '${{ github.repository }}' --name-only > changed.txt
        # A pull request always changes at least one file, so no files means a query that failed
        # without saying so -- an expired token, a rate limit, a connection dropped before the first
        # byte -- and not a diff that touches nothing.
        if [ ! -s changed.txt ]; then
          echo 'gh pr diff reported no files: leaving the gas comparison unfiltered' >&2
          exit 1
        fi
        node scripts/fetch-dependencies.js --entries='${{ inputs.src }}' --ext=.sol --filter --allow-removed \
          < changed.txt > diff.json
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      shell: bash
      continue-on-error: true
    - name: Compare reports
      if: github.event_name == 'pull_request' && hashFiles(inputs.ref_report) != ''
      run: |
        # diff.json exists only if the step above ran all the way through. -s rather than -f so a
        # half-written file counts as missing too: either way the answer is "could not tell", and
        # the fallback is no filter. An empty JSON array is three bytes and does filter, which is
        # what a diff genuinely reaching no contract should do.
        if [ -s diff.json ]; then
          filter=(--filtered diff.json)
        else
          filter=()
        fi
        node scripts/checks/compare-gas-reports.js ${{ inputs.report }} ${{ inputs.ref_report }} "${filter[@]}" | tee gas-report.md >> $GITHUB_STEP_SUMMARY
        echo '${{ github.event.number }}' > pr-number.txt
      env:
        STYLE: markdown
      shell: bash
      id: comparison
    # NOTE: the comment itself is NOT posted here. This job runs with a read-only
    # GITHUB_TOKEN whenever the PR comes from a fork, so any write to the issues
    # API fails with "Resource not accessible by integration". Instead we hand the
    # rendered comment off as an artifact; .github/workflows/gas-comment.yml picks
    # it up via `workflow_run` and posts it with a writable token.
    - name: Upload comparison
      if: steps.comparison.outcome == 'success' && github.event_name == 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: gas-comparison
        overwrite: true
        path: |
          gas-report.md
          pr-number.txt
    - name: Rename report for upload
      if: github.event_name != 'pull_request'
      run: |
        mv ${{ inputs.report }} ${{ inputs.out_report }}
      shell: bash
    - name: Save report
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: gasreport
        overwrite: true
        path: ${{ inputs.out_report }}
