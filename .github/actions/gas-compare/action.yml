name: Compare gas costs
description: Compare gas costs between branches
inputs:
  token:
    description: GitHub token, required to access GitHub API
    required: true
  report:
    description: Path to the report to compare
    required: false
    default: gasReporterOutput.json
  out_report:
    description: Path to save the output report
    required: false
    default: ${{ github.ref_name }}.gasreport.json
  ref_report:
    description: Path to the reference report for comparison
    required: false
    default: ${{ github.base_ref }}.gasreport.json

runs:
  using: composite
  steps:
    - name: Download reference report
      if: github.event_name == 'pull_request'
      run: |
        RUN_ID=`gh run list --repo ${{ github.repository }} --branch ${{ github.base_ref }} --workflow ${{ github.workflow }} --limit 100 --json 'conclusion,databaseId,event' --jq 'map(select(.conclusion=="success" and .event!="pull_request"))[0].databaseId'`
        gh run download ${RUN_ID} --repo ${{ github.repository }} -n gasreport
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      shell: bash
      continue-on-error: true # A base branch with no report yet is not an error: the step below is gated on the download having landed.
    - name: Compare reports
      if: github.event_name == 'pull_request' && hashFiles(inputs.ref_report) != ''
      run: |
        gh pr diff '${{ github.event.number }}' --repo '${{ github.repository }}' --name-only > changed.txt
        # A pull request always changes at least one file, so no files means a query that failed
        # without saying so -- an expired token, a rate limit, a connection dropped before the first
        # byte -- and not a diff that touches nothing.
        if [ -s changed.txt ]; then
          # Which contracts the diff reaches, following imports from every `src` tree. Both trees are walked
          # because the report names sources from both: the suite deploys the generated wrappers and the
          # contracts themselves. The rest of the report only measures test-suite churn: min/max/avg/median
          # move with the calls a run happens to make. `--allow-removed` because the exposed wrappers are
          # generated, so a diff never mentions them.
          node scripts/fetch-dependencies.js --entries=contracts,contracts-exposed --ext=.sol --filter --allow-removed < changed.txt > diff.json
          node scripts/checks/compare-gas-reports.js ${{ inputs.report }} ${{ inputs.ref_report }} --filtered diff.json | tee gas-report.md >> $GITHUB_STEP_SUMMARY
        else
          echo 'gh pr diff reported no files: leaving the gas comparison unfiltered' >&2
          node scripts/checks/compare-gas-reports.js ${{ inputs.report }} ${{ inputs.ref_report }} | tee gas-report.md >> $GITHUB_STEP_SUMMARY
        fi
        # The comparison is posted from another workflow, which only gets the artifact: it needs the number too.
        echo '${{ github.event.number }}' > pr-number.txt
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        STYLE: markdown
      shell: bash
      id: comparison
    # NOTE: the comment itself is NOT posted here. This job runs with a read-only
    # GITHUB_TOKEN whenever the PR comes from a fork, so any write to the issues
    # API fails with "Resource not accessible by integration". Instead we hand the
    # rendered comment off as an artifact; .github/workflows/gas-comment.yml picks
    # it up via `workflow_run` and posts it with a writable token.
    - name: Upload comparison
      if: steps.comparison.outcome == 'success' && github.event_name == 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: gas-comparison
        overwrite: true
        path: |
          gas-report.md
          pr-number.txt
    - name: Rename report for upload
      if: github.event_name != 'pull_request'
      run: |
        mv ${{ inputs.report }} ${{ inputs.out_report }}
      shell: bash
    - name: Save report
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: gasreport
        overwrite: true
        path: ${{ inputs.out_report }}
