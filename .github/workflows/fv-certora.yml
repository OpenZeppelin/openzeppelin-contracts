name: Formal verification - Certora

on:
  # Runs in the context of the base repository so that the CERTORAKEY secret is available to pull
  # requests opened from forks. Only the `verify` job below can read it: it is gated by the
  # `certora` environment, which requires a manual approval from a reviewer before the job starts.
  # Reviewers MUST check the diff for anything that could exfiltrate the key before approving.
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
  workflow_dispatch: {}

permissions:
  contents: read

# `github.ref` is the base branch under `pull_request_target`, so key on the pull request number
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A new push makes the running verification moot. Cancelling releases the runners it is holding,
  # and drops any environment approval still pending on it.
  cancel-in-progress: true

jobs:
  identify:
    runs-on: ubuntu-latest
    # The helper walks an import graph from a pull request that may be untrusted, so bound it
    timeout-minutes: 10
    # Runs on every pull request, with no label and no `environment`: it holds no secret and only
    # the read-only token granted by `permissions` above, so running the contributor's dependency
    # helper here needs no more trust than an ordinary `pull_request` job.
    outputs:
      configs: ${{ steps.identify.outputs.configs }}
    steps:
      - uses: actions/checkout@v7
        with:
          # `pull_request_target` checks out the base by default, but the dependency helper has to
          # read the configs and specs as the pull request leaves them. actions/checkout refuses a
          # fork checkout in this context unless that risk is explicitly acknowledged.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          allow-unsafe-pr-checkout: true
          fetch-depth: 0 # Include history so the diff against the pull request base resolves
          persist-credentials: false
      # No environment setup: `fv/dependencies.js` only uses node builtins, so the node preinstalled
      # on the runner is enough and `npm ci` can be skipped.
      - name: Identify the configs that need to be run
        id: identify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The label is only an override: without it, the diff decides which configs run
          FORCE_ALL: ${{ github.event_name != 'pull_request_target' || contains(github.event.pull_request.labels.*.name, 'formal-verification-force-all') }}
        run: |
          set -o pipefail
          if [[ $FORCE_ALL = 'true' ]]; then
            {
              printf 'configs='
              node fv/dependencies.js --all
            } >> "$GITHUB_OUTPUT"
          else
            # Keep a config if it, the specs it verifies, or anything those import was modified.
            # Three dots so the comparison starts at the merge base: `base.sha` is the tip of the
            # base branch, so a two dot range would also report whatever landed there after the
            # pull request branched, and verify configs the pull request never touched.
            {
              printf 'configs='
              git diff --name-only "$BASE_SHA"..."$HEAD_SHA" | node fv/dependencies.js --filter
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Report the affected configs
        env:
          CONFIGS: ${{ steps.identify.outputs.configs }}
        run: |
          echo "Configs affected by this diff: $CONFIGS" >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: identify
    # Runs whenever the diff reaches a spec, a harness or a contract one of them verifies. No label
    # is involved: the `certora` environment approval below is the human gate on prover time.
    if: needs.identify.outputs.configs != '[]'
    runs-on: ubuntu-latest
    # `--wait_for_results` blocks on the prover, so without this a job that never returns holds a
    # runner for the six hour default. 120 is generous enough for the slowest config; set the
    # CERTORA_TIMEOUT_MINUTES repository variable to change it without touching this file.
    # It is a variable and not an `env` entry because `env` is not one of the contexts a job-level
    # `timeout-minutes` can read.
    timeout-minutes: ${{ vars.CERTORA_TIMEOUT_MINUTES && fromJSON(vars.CERTORA_TIMEOUT_MINUTES) || 120 }}
    # This is the only job that reads CERTORAKEY, so it is the only one worth an admin approval.
    # Reviewers MUST check the diff for anything that could exfiltrate the key before approving.
    # One approval releases every job of the matrix.
    environment: certora
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.identify.outputs.configs) }}
    name: verify (${{ matrix.config }})
    steps:
      - uses: actions/checkout@v7
        with:
          # Runs the contributor's code, which is what the approval above is protecting against.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          # Read the cache, never write it. The scope is the base branch here, so a cache saved after
          # the contributor's code has run would be restored by every other workflow.
          cache: 'restore'
          solc: 'on'
          java: 'on'
          python: 'on'
          python-requirements: 'fv-requirements.txt'
      - name: Verify specification
        env:
          # The config name comes from a pull request that may be untrusted. It is passed through
          # the environment (and never interpolated into the script) so that a shell never parses it.
          CONFIG: ${{ matrix.config }}
          CERTORAKEY: ${{ secrets.CERTORAKEY }}
        run: |
          set -o pipefail
          make -C fv apply
          STATUS=0
          certoraRun "$CONFIG" --wait_for_results | tee certora.log || STATUS=$?
          URL=$(grep -om1 'https://prover.certora.com/output/[a-z0-9]*/[a-z0-9]*?anonymousKey=[a-z0-9]*' certora.log || true)
          echo "- $([[ $STATUS = 0 ]] && echo '✅' || echo '❌') \`$CONFIG\` ${URL:+- [report]($URL)}" >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

  # Every matrix job carries its config in its name, so none of them is a stable name to require in
  # branch protection, and a run where nothing was affected produces no such job at all. This one
  # always runs and always has the same name, so it is the check to require.
  verified:
    needs: [identify, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the verification results
        env:
          IDENTIFY: ${{ needs.identify.result }}
          VERIFY: ${{ needs.verify.result }}
        run: |
          echo "identify: $IDENTIFY, verify: $VERIFY"
          # A matrix result is the aggregate of its jobs: `success` only if every one of them
          # passed, `skipped` when the whole job was gated out by its `if`.
          [[ $IDENTIFY = 'success' ]] || { echo "::error::could not work out which configs to run"; exit 1; }
          case $VERIFY in
            success) echo "::notice::every affected config verified" ;;
            skipped) echo "::notice::this diff affects no config" ;;
            *) echo "::error::verification $VERIFY"; exit 1 ;;
          esac
