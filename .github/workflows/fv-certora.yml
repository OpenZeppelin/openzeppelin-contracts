name: Formal verification - Certora

on:
  # Runs in the context of the base repository so that the CERTORAKEY secret is available to pull
  # requests opened from forks. Access is gated by the `certora` environment, which requires a
  # manual approval from a reviewer before the job starts. Reviewers MUST check the diff for
  # anything that could exfiltrate the key before approving.
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
  workflow_dispatch: {}

permissions:
  contents: read

# `github.ref` is the base branch under `pull_request_target`, so key on the pull request number
concurrency: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: certora
    if: github.event_name != 'pull_request_target' || contains(github.event.pull_request.labels.*.name, 'formal-verification') || contains(github.event.pull_request.labels.*.name, 'formal-verification-force-all')
    steps:
      - uses: actions/checkout@v7
        with:
          # `pull_request_target` checks out the base by default. This runs the contributor's code,
          # which is why the environment approval above is required. actions/checkout refuses a fork
          # checkout in this context unless that risk is explicitly acknowledged.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          allow-unsafe-pr-checkout: true
          fetch-depth: 0 # Include history so the diff against the PR base resolves
          persist-credentials: false
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          # Read the cache, never write it. The scope is the base branch here, so a cache saved after
          # the contributor's code has run would be restored by every other workflow.
          cache: 'restore'
          solc: 'on'
          java: 'on'
          python: 'on'
          python-requirements: 'fv-requirements.txt'
          # certoraRun reads `forge remappings` when forge is present, which emits a `hardhat`
          # key that package.json also provides, and it rejects the duplicate. This job has no
          # use for forge.
          foundry: 'off'
      - name: identify specs that need to be run
        id: arguments
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ ${{ github.event_name }} = 'pull_request_target' && ${{ contains(github.event.pull_request.labels.*.name, 'formal-verification-force-all') }} = 'false' ]];
          then
            # Map each changed spec to the configs that verify it. A spec can back several
            # configs. One that no config names is a shared import (a base or a helper) whose
            # blast radius this step cannot bound, so fail and let the author opt into a full run.
            #
            # Config names come from the file names of a pull request that may be untrusted, and
            # end up on a command line downstream. Anything that is not a plain name is dropped.
            RESULT=$(git diff "$HEAD_SHA".."$BASE_SHA" --name-only -- 'fv/specs/*.spec' | while IFS= read -r file; do
              [[ -f $file ]] || continue
              grep -lF "$file" fv/specs/*.conf || { echo "$file is imported by other specs and verified by no config of its own; add the formal-verification-force-all label to run everything." >&2; exit 1; }
            done | sort -u | while IFS= read -r conf; do
              name=${conf##*/}; name=${name%.conf}
              [[ $name =~ ^[A-Za-z0-9_-]+$ ]] && echo "$name" || echo "Ignoring config with unexpected name: $name" >&2
            done | tr "\n" " ")
          else
            RESULT='--all'
          fi
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
      - name: Verify specification
        env:
          SPEC_ARGUMENTS: ${{ steps.arguments.outputs.result }}
          CERTORAKEY: ${{ secrets.CERTORAKEY }}
        run: |
          make -C fv apply
          read -r -a specs <<< "$SPEC_ARGUMENTS"
          node fv/run.js "${specs[@]}" -p 1 -v >> "$GITHUB_STEP_SUMMARY"

      # ┌────────────────────────────────────────────────────────────────────────────────────────┐
      # │ Timeout ledger: rules that are NOT proved. Excluded from every config, so their         │
      # │ absence from a green run is not a pass. Re-attempt manually with the commands below.    │
      # └────────────────────────────────────────────────────────────────────────────────────────┘
      #
      # ERC4626 -- both hold under exhaustive small-value and large random sampling, so these are
      # solver cost rather than defects. Last attempted with nonlinear arithmetic forced, splitting
      # off, a ten-seed solver race, smt_timeout 1500 and global_timeout 3600.
      #
      # certoraRun fv/specs/ERC4626_split.conf --rule withdrawIsNotSplittable
      #   https://prover.certora.com/output/1392759/b8f698631bf44d2692643a24910ab356?anonymousKey=4665bdc5b6546cb042145a333d271d06c89e44a4
      #   timed out at 3003s; its strictness witness verifies in 9s
      #
      # certoraRun fv/specs/ERC4626_split.conf --rule holdingBackAcrossDonationDoesNotPay
      #   https://prover.certora.com/output/1392759/b8f698631bf44d2692643a24910ab356?anonymousKey=4665bdc5b6546cb042145a333d271d06c89e44a4
      #   timed out at 1504s; its arithmetic core verifies in ~1s in closed form, so the cost is
      #   the five-operation replay rather than the share math
      #
      # What the suite assumes rather than proves is recorded at the top of fv/specs/ERC4626Base.spec.
