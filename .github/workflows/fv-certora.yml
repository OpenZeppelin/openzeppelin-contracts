name: Formal verification - Certora

on:
  # Base-repo context so a fork's PR can reach the CERTORAKEY secret. Only `verify` reads it, gated by
  # the `certora` environment's manual approval -- reviewers MUST check the diff for key exfiltration.
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
  workflow_dispatch: {}

permissions:
  contents: read

# `github.ref` is the base branch under `pull_request_target`, so key on the pull request number
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # No secret, no environment, read-only token: running the dependency helper here needs no more trust
  # than an ordinary `pull_request` job.
  identify:
    runs-on: ubuntu-latest
    # The helper walks an import graph from a pull request that may be untrusted, so bound it
    timeout-minutes: 10
    outputs:
      configs: ${{ steps.identify.outputs.configs }}
    steps:
      # Base branch (this workflow's own source under pull_request_target). The helper runs from HERE,
      # never the PR: a PR that rewrote it to print `[]` would skip `verify` and pass `verified` green.
      - uses: actions/checkout@v7
        with:
          path: base
          persist-credentials: false
      # The PR, read as data only (never executed); checkout needs the fork risk acknowledged.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          allow-unsafe-pr-checkout: true
          fetch-depth: 0 # full history so the base...head diff can find its merge-base
          path: head
          persist-credentials: false
      - name: Identify the configs that need to be run
        id: identify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORCE_ALL_FLAG: ${{ (github.event_name != 'pull_request_target' || contains(github.event.pull_request.labels.*.name, 'formal-verification-force-all')) && '--all' || '' }}
          ALLOW_REMOVED_FLAG: ${{ contains(github.event.pull_request.labels.*.name, 'formal-verification-allow-removal') && '--allow-removed' || '' }}
        run: |
          changed=$(git -C head diff --name-only "$BASE_SHA"..."$HEAD_SHA") # unused on --all
          echo "configs=$(node base/fv/dependencies.js --root=head "${FORCE_ALL_FLAG:-$ALLOW_REMOVED_FLAG}" <<< "$changed")" >> "$GITHUB_OUTPUT"
      - name: Report the affected configs
        env:
          CONFIGS: ${{ steps.identify.outputs.configs }}
        run: |
          echo "Configs affected by this diff: $CONFIGS" >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: identify
    if: needs.identify.outputs.configs != '[]'
    runs-on: ubuntu-latest
    # Cap the prover wait; override via CERTORA_TIMEOUT_MINUTES (a repo var, not env -- timeout-minutes can't read env).
    timeout-minutes: ${{ vars.CERTORA_TIMEOUT_MINUTES && fromJSON(vars.CERTORA_TIMEOUT_MINUTES) || 120 }}
    # The only job that reads CERTORAKEY, so the only one gated. Reviewers MUST check the diff for key
    # exfiltration before approving; one approval releases the whole matrix.
    environment: certora
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.identify.outputs.configs) }}
    name: verify (${{ matrix.config }})
    steps:
      - uses: actions/checkout@v7
        with:
          # Runs the contributor's code, which is what the approval above is protecting against.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          # Read the cache, never write it. The scope is the base branch here, so a cache saved after
          # the contributor's code has run would be restored by every other workflow.
          cache: 'restore'
          solc: 'on'
          java: 'on'
          python: 'on'
          python-requirements: 'fv-requirements.txt'
      - name: Verify specification
        env:
          # Possibly-untrusted config name: passed via env, never interpolated, so no shell parses it.
          CONFIG: ${{ matrix.config }}
          CERTORAKEY: ${{ secrets.CERTORAKEY }}
        run: |
          set -o pipefail
          make -C fv apply
          STATUS=0
          certoraRun "$CONFIG" --wait_for_results | tee certora.log || STATUS=$?
          URL=$(grep -om1 'https://prover.certora.com/output/[a-zA-Z0-9]*/[a-zA-Z0-9]*?anonymousKey=[a-zA-Z0-9]*' certora.log || true)
          echo "- $([[ $STATUS = 0 ]] && echo '✅' || echo '❌') \`$CONFIG\` ${URL:+- [report]($URL)}" >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

  # single `required status check` for branch protection
  verified:
    needs: [identify, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the verification results
        env:
          IDENTIFY: ${{ needs.identify.result }}
          VERIFY: ${{ needs.verify.result }}
        run: |
          [[ $IDENTIFY = success ]] || { echo "::error::could not work out which configs to run"; exit 1; }
          [[ $VERIFY = success || $VERIFY = skipped ]] || { echo "::error::verification $VERIFY"; exit 1; }
